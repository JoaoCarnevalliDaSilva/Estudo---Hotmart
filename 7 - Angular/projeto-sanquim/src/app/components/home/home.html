
<div class="login-container">
  <div class="login-card">
    <h2>Login - Projeto Sanquim</h2>
    <p>Entre com suas credenciais para acessar o sistema.</p>

    <form (ngSubmit)="fazerLogin()">
      
      <div class="input-group">
        <label for="email">Digite seu Email</label>
        <input type="email" id="email" [(ngModel)]="emailDigitado" name="email" placeholder="seu.email@exemplo.com" required>
      </div>

      <div class="input-group">
        <label for="senha">Digite sua Senha</label>
        <input type="password" id="senha" [(ngModel)]="senhaDigitada" name="senha" placeholder="******" required>
      </div>

      <button type="submit" class="btn-entrar">Entrar</button>
    </form>
  </div>
</div>
